<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Calculadora para contas simples.">

        <title>Calculadora web</title>

        <link rel="stylesheet" href="calculadora.css">
        <script src="calculadora.js" defer></script>
</head>
    <body>
        <header class="header">
            <div class="logo">
                <img src="https://i.pinimg.com/736x/7c/39/a8/7c39a81d76f414510a97b8b2bbc5d8a3.jpg" alt="Personagem Lily" width="60">
                <h1 class="logo">Calcule com a Lily!</h1>
            </div>
        </header>

        <main>
            <section class="hero">

                    <form id="calculadora">

                        <h2>Bem vindo a calculadora web!</h2>

                        <label  for="numero1">
                        <input type="number" step="any" placeholder="Primeiro número" id="numero1" required>
                        </label>

                        <select id="operacao">
                                <option value="Operação" disabled selected>Selecione uma operação</option>
                                <option value="+">+ (Soma)</option>
                                <option value="-">- (Subtração)</option>
                                <option value="*">x (Multiplicação)</option>
                                <option value="/">÷ (Divisão)</option>
                        </select>

                        <label  for="numero2">
                        <input type="number" step="any" placeholder="Segundo número" id="numero2" required> 
                        </label>


                        <p id="resultado"></p>
                        <div class="botoes">
                            <button type="button" id="botaoCalcular">
                                Calcular
                            </button>

                            <button type="button" id="botaoLimpar">
                                Limpar
                            </button>
                            </div>
                    </form>
                <img id="lily" src="https://i.pinimg.com/736x/a5/8f/4b/a58f4b4d3eb41bc354ff34afb8809ab6.jpg" alt="Lily">
            </section>
        </main>
    </body>
</html>
