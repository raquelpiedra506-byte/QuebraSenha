<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deep Word</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <!--Logo do jogo-->
        <header>
            <img src="https://i.pinimg.com/originals/28/bc/44/28bc44b5eed41b8a0b7829231bd684ad.gif"
            alt="Imagem de um detetive digital" width="100px" height="100px">
            <h1>Deep Word</h1>

            <!--Menu de navegação (É pra voltar pro inicio)-->
            <nav>
                <a href="inicial.html"><img src="https://i.pinimg.com/736x/9a/c2/9f/9ac29fc202d08ba120dcbecf5a0784ed.jpg" width="40px"></a>
            </nav>
        </header>

        <main class="maingame">
            <!--Quadrado que tem as coisas do jogo-->
            <section id="conteudo_principal" class="jogo">
                <!--Botão de dica-->
                <aside>
                    <button class="dicaBut" type="button" onclick="showHint()"><p>Dica</p><img src="https://i.pinimg.com/736x/19/4b/cf/194bcf0fee0575f24a037b9b0073037e.jpg"
                    alt="Imagem de um detetive digital" width="100px" height="100px"></button>
                    
                    <article>
                        <p id="dica" class="dicaTxt"></p>
                    </article>
                </aside>

                <!--Caixa principal com o jogo em si-->
                <article class="artic">
                    <h2>Descubra a senha</h2>                  
                    <p>Tentativas: <span id="tentativa"></span></p>
                    <br>
                    <p id="senha">Senha:<input type="text" name="password" placeholder="digite a senha" required></p>
                
                    <button type="button" onclick="checkPassword()">Entrar</button>

                    <div id="resultado"></div>
                </article>

                <!-- Histórico das tentativas -->
                <div id="historico" class="hist">
                    <h3>Histórico das tentativas:</h3>
                    <br>
                    <ul id="tentativas_anteriores"></ul>
                </div>

            </section>
        </main>
    </body>
</html>
